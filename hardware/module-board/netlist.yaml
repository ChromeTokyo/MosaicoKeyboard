  # ---- 备用与不连接 ----
  SLOT_SPARE_GPIO4:
    class: signal
    gpio: 4
    note: 第 11 根可用 GPIO，备用；仅到测试点，不跨 J3、不到 J2，供迭代换针
    pins: [[J1, 12], [TP_SPARE, 1]]

  SLOT_5V_OUT_NC:
    class: no-connect
    note: 主机 5V_OUT（GPIO60 控制）。绝不连接任何网络（硬约束 2）；焊盘不连铜、无测试点，丝印「NC」。P8 直接探 J1 焊针
    pins: [[J1, 18]]

  SLOT_USJ_DN:
    class: no-connect
    note: GPIO33 USB Serial/JTAG D−，保留；焊盘存在、不连铜、无测试点（AS-30）
    pins: [[J1, 13]]

  SLOT_USJ_DP:
    class: no-connect
    note: GPIO34 USB Serial/JTAG D+，保留；同上
    pins: [[J1, 15]]
