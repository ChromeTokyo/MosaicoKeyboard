<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif">
<rect width="1200" height="980" fill="#14161a"/>
<text x="40" y="52" fill="#f0f2f5" font-size="27" font-weight="600">ESP-Mosaico 手持终端 · 方案 D + G 概念示意</text>
<text x="40" y="80" fill="#8b93a1" font-size="15">示意图，比例参考。除 Mosaico 本体外所有尺寸均未冻结，不得用于设计或制造。</text>

<!-- ============ 正视图 ============ -->
<text x="40" y="128" fill="#5db0ff" font-size="18" font-weight="600">正视图（握持状态）</text>

<!-- 机身 -->
<path d="M70 165 q-22 0 -22 26 v168 q0 26 22 26 h1010 q22 0 22 -26 v-168 q0 -26 -22 -26 z" fill="#232830" stroke="#3d4553" stroke-width="2"/>
<!-- 握把加厚示意 -->
<path d="M70 165 q-22 0 -22 26 v168 q0 26 22 26 h96 v-220 z" fill="#1c2027" stroke="#3d4553" stroke-width="1.5"/>
<path d="M1080 165 q22 0 22 26 v168 q0 26 -22 26 h-96 v-220 z" fill="#1c2027" stroke="#3d4553" stroke-width="1.5"/>
<text x="76" y="300" fill="#6b7482" font-size="13">握把</text>
<text x="1020" y="300" fill="#6b7482" font-size="13">握把</text>

<!-- 肩键 -->
<rect x="190" y="152" width="120" height="16" rx="7" fill="#3a4250" stroke="#4d5766" stroke-width="1.5"/>
<text x="232" y="146" fill="#8b93a1" font-size="14">L</text>
<rect x="840" y="152" width="120" height="16" rx="7" fill="#3a4250" stroke="#4d5766" stroke-width="1.5"/>
<text x="888" y="146" fill="#8b93a1" font-size="14">R</text>

<!-- Mosaico 屏幕 -->
<rect x="480" y="198" width="215" height="215" rx="18" fill="#0a0c0f" stroke="#e8503a" stroke-width="2.5"/>
<rect x="496" y="214" width="183" height="183" rx="9" fill="#05070a" stroke="#242a33" stroke-width="1"/>
<text x="524" y="312" fill="#4a5260" font-size="15">480 × 480 AMOLED</text>
<text x="521" y="446" fill="#e8503a" font-size="14" font-weight="600">ESP-Mosaico 本体</text>
<text x="498" y="466" fill="#8b93a1" font-size="12.5">官方标称 45.19 × 45.19 × 11.48 mm · 33 g</text>

<!-- D-pad -->
<g transform="translate(250,305)">
  <path d="M-16 -46 h32 v30 h30 v32 h-30 v30 h-32 v-30 h-30 v-32 h30 z" fill="#3a4250" stroke="#525c6b" stroke-width="1.6"/>
  <circle cx="0" cy="0" r="5.5" fill="#262c35"/>
</g>
<text x="216" y="400" fill="#8b93a1" font-size="13.5">D-pad ×4</text>

<!-- ABXY -->
<g transform="translate(900,305)">
  <circle cx="0" cy="-36" r="17" fill="#3a4250" stroke="#525c6b" stroke-width="1.6"/><text x="-5" y="-31" fill="#aeb6c2" font-size="14">X</text>
  <circle cx="-36" cy="0" r="17" fill="#3a4250" stroke="#525c6b" stroke-width="1.6"/><text x="-41" y="5" fill="#aeb6c2" font-size="14">Y</text>
  <circle cx="36" cy="0" r="17" fill="#3a4250" stroke="#525c6b" stroke-width="1.6"/><text x="31" y="5" fill="#aeb6c2" font-size="14">A</text>
  <circle cx="0" cy="36" r="17" fill="#3a4250" stroke="#525c6b" stroke-width="1.6"/><text x="-5" y="41" fill="#aeb6c2" font-size="14">B</text>
</g>
<text x="866" y="400" fill="#8b93a1" font-size="13.5">ABXY ×4</text>

<!-- 模块板位置 -->
<rect x="440" y="206" width="26" height="199" rx="4" fill="#2f6f4f" stroke="#49b07c" stroke-width="2"/>
<text x="300" y="196" fill="#49b07c" font-size="13.5">底座模块板（常驻，插左槽）</text>
<path d="M415 200 L448 214" stroke="#49b07c" stroke-width="1.4" fill="none"/>

<!-- 右槽空出 -->
<rect x="709" y="206" width="26" height="199" rx="4" fill="#24303f" stroke="#41536b" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="752" y="196" fill="#7b8b9e" font-size="13.5">右槽空出</text>
<path d="M748 200 L733 212" stroke="#7b8b9e" stroke-width="1.4" fill="none"/>

<!-- USB-C -->
<rect x="556" y="406" width="62" height="12" rx="6" fill="#4b5563" stroke="#697384" stroke-width="1.2"/>
<text x="500" y="496" fill="#d2a24c" font-size="13">Mosaico 原生 USB-C 朝下，保持暴露</text>
<path d="M568 418 L560 486" stroke="#d2a24c" stroke-width="1.3" fill="none"/>

<rect x="330" y="389" width="72" height="13" rx="6" fill="#4b5563" stroke="#697384" stroke-width="1.2"/>
<text x="238" y="424" fill="#8b93a1" font-size="13">底座 USB-C（充电／连电脑）</text>

<!-- ============ 连接链 ============ -->
<text x="40" y="566" fill="#5db0ff" font-size="18" font-weight="600">连接链（俯视剖示）</text>

<rect x="70" y="596" width="230" height="130" rx="12" fill="#232830" stroke="#e8503a" stroke-width="2"/>
<text x="112" y="650" fill="#f0f2f5" font-size="16" font-weight="600">ESP-Mosaico</text>
<text x="112" y="676" fill="#8b93a1" font-size="13">完整、不拆解</text>
<text x="112" y="698" fill="#8b93a1" font-size="13">不改主板、不焊线</text>

<rect x="380" y="596" width="215" height="130" rx="12" fill="#1e3329" stroke="#49b07c" stroke-width="2"/>
<text x="410" y="642" fill="#8fe0b4" font-size="16" font-weight="600">底座模块板</text>
<text x="410" y="668" fill="#9fb3a8" font-size="13">10 × 轻触开关</text>
<text x="410" y="690" fill="#9fb3a8" font-size="13">1 × AT24C02 @ 0x50</text>
<text x="410" y="712" fill="#9fb3a8" font-size="13">无 MCU · 无 I²C 扩展器</text>

<rect x="675" y="596" width="215" height="130" rx="12" fill="#232830" stroke="#5db0ff" stroke-width="2"/>
<text x="705" y="642" fill="#f0f2f5" font-size="16" font-weight="600">底座主体</text>
<text x="705" y="668" fill="#8b93a1" font-size="13">电池 1000–2000 mAh</text>
<text x="705" y="690" fill="#8b93a1" font-size="13">充电 · 升压 · 保护</text>
<text x="705" y="712" fill="#8b93a1" font-size="13">USB-C · 外壳 · 键帽</text>

<!-- 箭头1 -->
<path d="M300 661 H372" stroke="#49b07c" stroke-width="2.2" fill="none" marker-end="url(#a1)"/>
<text x="286" y="586" fill="#49b07c" font-size="13">左模块槽 2×10P</text>
<text x="292" y="748" fill="#8fe0b4" font-size="13" font-weight="600">装配时插一次，此后不拔</text>
<text x="299" y="768" fill="#6b7482" font-size="12">→ 排针寿命问题消除</text>

<!-- 箭头2 -->
<path d="M595 661 H667" stroke="#5db0ff" stroke-width="2.2" fill="none" marker-end="url(#a2)"/>
<text x="580" y="586" fill="#5db0ff" font-size="13">弹簧针／磁吸</text>
<text x="576" y="748" fill="#9ed0ff" font-size="13" font-weight="600">每天频繁分离</text>
<text x="570" y="768" fill="#6b7482" font-size="12">→ 用为此设计的连接器</text>

<defs>
<marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#49b07c"/></marker>
<marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5db0ff"/></marker>
</defs>

<!-- 左槽信号 -->
<rect x="935" y="576" width="228" height="176" rx="10" fill="#1a1d23" stroke="#3d4553" stroke-width="1.5"/>
<text x="955" y="604" fill="#5db0ff" font-size="14" font-weight="600">左槽一个连接器全包</text>
<text x="955" y="632" fill="#c3cad4" font-size="12.5">pin17　5V_IN　供电＋充电</text>
<text x="955" y="656" fill="#c3cad4" font-size="12.5">pin20　GND</text>
<text x="955" y="680" fill="#c3cad4" font-size="12.5">pin16/14　SDA / SCL</text>
<text x="968" y="700" fill="#6b7482" font-size="11.5">V1.2 模块槽独立 I²C 总线</text>
<text x="955" y="724" fill="#c3cad4" font-size="12.5">pin10　GPIO14　EEPROM 选址</text>
<text x="955" y="744" fill="#c3cad4" font-size="12.5">其余 11 根　10 键直连</text>

<!-- ============ 底部说明 ============ -->
<line x1="40" y1="808" x2="1160" y2="808" stroke="#2c323c" stroke-width="1"/>
<text x="40" y="840" fill="#d2a24c" font-size="14" font-weight="600">需要你决定的取舍</text>
<text x="40" y="866" fill="#aeb6c2" font-size="13">摄像头模块只能插左槽，而底座也想用左槽（右槽有 5 根脚与板载音频 I2S 复用，占了就没有扬声器和麦克风）。</text>
<text x="40" y="888" fill="#aeb6c2" font-size="13">三选一：① 底座占左槽，摄像头不能同时用　② 底座占右槽，放弃板载音频　③ 摄像头与底座分时使用。</text>

<text x="40" y="928" fill="#6b7482" font-size="12.5">未冻结项：模块连接器机械形态（E-01）· 5V_IN 载流能力（官方无数值）· 模块引脚可及性 · 整机精确尺寸 · 机身总长与握把形态</text>
<text x="40" y="950" fill="#6b7482" font-size="12.5">技术判定权属 Chrome，独立复核属 Hiro。本图为产品方向示意，不构成任何工程结论。</text>
</svg>
